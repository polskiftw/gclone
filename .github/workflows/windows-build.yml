name: windows-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Check worker syntax
        shell: pwsh
        run: |
          python -m py_compile engines/qwen/worker.py
          python -m py_compile engines/index/worker.py
      - name: Check provisioning script syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem engines -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse errors in " + $_.FullName + ": " + ($errors -join "; "))
            }
          }
          if ($failed) { exit 1 }
      - name: Smoke app-local uv and managed Python bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "gclone-provision-smoke"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $root
          try {
            . .\engines\common\bootstrap-uv.ps1
            $uv = Initialize-GCloneUv -GCloneRoot $root
            & $uv --version
            if ($LASTEXITCODE -ne 0) { throw "uv bootstrap smoke test failed." }
            & $uv python install 3.11 3.12
            if ($LASTEXITCODE -ne 0) { throw "Managed Python bootstrap smoke test failed." }
            & $uv python find 3.11
            if ($LASTEXITCODE -ne 0) { throw "Managed Python 3.11 was not found after installation." }
            & $uv python find 3.12
            if ($LASTEXITCODE -ne 0) { throw "Managed Python 3.12 was not found after installation." }
          }
          finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $root
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gclone-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            build/Release/gclone.exe
            build/Release/engines/**
